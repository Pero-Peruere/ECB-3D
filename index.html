<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECB-3D | Catálogo Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Fundo exato de acordo com a sua pasta */
        .parallax-bg {
            background-image: url('maxresdefault%20(1)%20(1).jpg');
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        
        .parallax-overlay {
            background-color: rgba(0, 0, 0, 0.75);
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

    <header class="relative h-screen flex items-center justify-center parallax-bg">
        <div class="absolute inset-0 parallax-overlay"></div>
        
        <div class="relative z-10 text-center px-4 text-white">
            <h1 class="text-6xl md:text-8xl font-bold tracking-tighter mb-4">ECB-3D</h1>
            <p class="text-xl md:text-2xl text-gray-300 font-light max-w-2xl mx-auto">
                Transformando ideias em realidade. Peças exclusivas, personagens e utilidades impressas em 3D com alta qualidade e precisão.
            </p>
        </div>

        <div class="absolute bottom-10 left-1/2 transform -translate-x-1/2 animate-bounce text-gray-400">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
            </svg>
        </div>
    </header>

    <nav class="sticky top-0 z-40 bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-center md:justify-end py-4 overflow-x-auto no-scrollbar space-x-6">
                <button onclick="filtrarCategoria('Todos')" class="category-btn text-gray-900 font-medium whitespace-nowrap hover:text-gray-500 transition-colors border-b-2 border-gray-900">Todos</button>
                <button onclick="filtrarCategoria('Personagens')" class="category-btn text-gray-500 font-medium whitespace-nowrap hover:text-gray-900 transition-colors">Personagens</button>
                <button onclick="filtrarCategoria('Decoração')" class="category-btn text-gray-500 font-medium whitespace-nowrap hover:text-gray-900 transition-colors">Decoração</button>
                <button onclick="filtrarCategoria('Miniaturas')" class="category-btn text-gray-500 font-medium whitespace-nowrap hover:text-gray-900 transition-colors">Miniaturas</button>
                <button onclick="filtrarCategoria('Utilidades')" class="category-btn text-gray-500 font-medium whitespace-nowrap hover:text-gray-900 transition-colors">Utilidades</button>
                <button onclick="filtrarCategoria('Outros')" class="category-btn text-gray-500 font-medium whitespace-nowrap hover:text-gray-900 transition-colors">Outros</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
        </div>
    </main>

    <div id="product-modal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-80 flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-lg shadow-2xl max-w-4xl w-full flex flex-col md:flex-row overflow-hidden relative fade-in">
            <button onclick="fecharModal()" class="absolute top-4 right-4 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-full p-2 transition-colors z-10">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>

            <div class="w-full md:w-1/2 bg-gray-100 flex items-center justify-center p-8">
                <img id="modal-image" src="" alt="Produto" class="max-h-96 object-contain drop-shadow-xl">
            </div>

            <div class="w-full md:w-1/2 p-8 flex flex-col justify-center">
                <span id="modal-category" class="text-xs uppercase tracking-widest text-gray-500 mb-2 font-semibold"></span>
                <h2 id="modal-title" class="text-3xl font-bold text-gray-900 mb-4"></h2>
                <p id="modal-description" class="text-gray-600 mb-8 leading-relaxed"></p>
                
                <a id="modal-whatsapp-btn" href="#" target="_blank" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-4 px-6 rounded text-center transition-colors shadow-lg flex justify-center items-center gap-2">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                    </svg>
                    Tenho interesse no WhatsApp
                </a>
            </div>
        </div>
    </div>

    <script>
        // Nomes atualizados para corresponderem exatamente aos seus ficheiros
        const produtos = [
            {
                id: 1,
                name: "Batman - Fato Clássico",
                category: "Personagens",
                image: "batman_2.webp.webp",
                description: "Figura de ação do Batman com o fato clássico cinzento e preto. Impressão 3D de alta qualidade, destacando os detalhes da capa e do cinto de utilidades castanho."
            },
            {
                id: 2,
                name: "Super-Homem",
                category: "Personagens",
                image: "superman.webp",
                description: "Figura do Super-Homem em pose heroica com cores vibrantes. Peça impressa em 3D com excelente definição no emblema e na textura do fato."
            },
            {
                id: 3,
                name: "Wolverine",
                category: "Personagens",
                image: "wolverine.webp",
                description: "Modelo detalhado do Wolverine com o icónico fato amarelo e azul. Impressão precisa que captura a tensão da pose e o detalhe das garras pretas."
            },
            {
                id: 4,
                name: "Goku Super Guerreiro",
                category: "Personagens",
                image: "Goku.webp",
                description: "Estatueta do Goku transformado em Super Guerreiro. Acabamento fantástico com cores vivas no fato cor de laranja, ideal para qualquer colecionador."
            },
            {
                id: 5,
                name: "Mickey Mouse",
                category: "Personagens",
                image: "mikcey.webp",
                description: "Miniatura encantadora do Rato Mickey sentado. Impressão 3D impecável com superfícies suaves e os clássicos sapatos amarelos."
            },
            {
                id: 6,
                name: "Daffy Duck - Smoking",
                category: "Personagens",
                image: "pato.webp",
                description: "Figura do Daffy Duck vestido de forma elegante com um smoking preto e um laço roxo. Excelente detalhe e contraste de cores."
            },
            {
                id: 7,
                name: "Daffy Duck - Laço Azul",
                category: "Personagens",
                image: "pato%202.webp",
                description: "Daffy Duck com a sua clássica expressão zangada e as mãos na cintura, complementado com um laço azul. Peça divertida e bem detalhada."
            },
            {
                id: 8,
                name: "Daffy Duck - Casual",
                category: "Personagens",
                image: "pato%203.webp",
                description: "Versão do Daffy Duck a usar calças azuis e um cinto castanho. Impressão 3D rigorosa que traz a personagem à vida de forma autêntica."
            },
            {
                id: 9,
                name: "Daffy Duck - Furioso",
                category: "Personagens",
                image: "pato%204.webp",
                description: "Daffy Duck em pose de fúria com os punhos cerrados e um laço azul. Ideal para decorar o seu espaço com um toque de humor."
            }
        ];

        const numeroWhatsApp = "5545988006795";
        let categoriaAtual = 'Todos';

        function renderizarProdutos(produtosFiltrados) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = ''; 

            produtosFiltrados.forEach(function(produto) {
                const cardHTML = 
                    '<div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300 cursor-pointer flex flex-col h-full" onclick="abrirModal(' + produto.id + ')">' +
                        '<div class="h-64 bg-gray-100 flex items-center justify-center p-4">' +
                            '<img src="' + produto.image + '" alt="' + produto.name + '" class="h-full object-contain mix-blend-multiply drop-shadow-md transition-transform duration-500 hover:scale-110">' +
                        '</div>' +
                        '<div class="p-5 flex-grow flex flex-col justify-between border-t border-gray-100">' +
                            '<div>' +
                                '<p class="text-xs text-gray-500 uppercase tracking-wider mb-1">' + produto.category + '</p>' +
                                '<h3 class="text-lg font-bold text-gray-900 leading-tight mb-4">' + produto.name + '</h3>' +
                            '</div>' +
                            '<button class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded transition-colors text-sm">Ver Detalhes</button>' +
                        '</div>' +
                    '</div>';
                
                grid.innerHTML += cardHTML;
            });
        }

        function filtrarCategoria(categoria) {
            categoriaAtual = categoria;
            
            const botoes = document.querySelectorAll('.category-btn');
            botoes.forEach(function(btn) {
                if (btn.innerText === categoria) {
                    btn.classList.remove('text-gray-500');
                    btn.classList.add('text-gray-900', 'border-b-2', 'border-gray-900');
                } else {
                    btn.classList.add('text-gray-500');
                    btn.classList.remove('text-gray-900', 'border-b-2', 'border-gray-900');
                }
            });

            if (categoria === 'Todos') {
                renderizarProdutos(produtos);
            } else {
                const filtrados = produtos.filter(function(p) { return p.category === categoria; });
                renderizarProdutos(filtrados);
            }
        }

        function abrirModal(idProduto) {
            const produto = produtos.find(function(p) { return p.id === idProduto; });
            if (!produto) return;

            document.getElementById('modal-image').src = decodeURI(produto.image);
            document.getElementById('modal-title').innerText = produto.name;
            document.getElementById('modal-category').innerText = produto.category;
            document.getElementById('modal-description').innerText = produto.description;

            const mensagem = "Olá! Me interessei pelo produto *" + produto.name + "*. Gostaria de saber se ele está disponível.";
            const urlWhatsApp = "https://wa.me/" + numeroWhatsApp + "?text=" + encodeURIComponent(mensagem);
            
            document.getElementById('modal-whatsapp-btn').href = urlWhatsApp;

            const modal = document.getElementById('product-modal');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function fecharModal() {
            const modal = document.getElementById('product-modal');
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('product-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                fecharModal();
            }
        });

        filtrarCategoria('Todos');
    </script>
</body>
</html>
